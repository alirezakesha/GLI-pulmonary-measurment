# =============================================================================
# Nginx — GLI app at https://YOUR_DOMAIN/gli/  (subpath, not site root)
# =============================================================================
# Prerequisites:
#   1. Build frontend with subpath:  VITE_BASE_PATH=/gli/ ./scripts/production-build.sh
#   2. HTTPS cert already issued (certbot) OR start from HTTP block below first
#
# Install (after certbot has created /etc/letsencrypt/... on this server):
#   sudo cp .../deploy/nginx-gli-pft-subpath.conf /etc/nginx/sites-available/gli-pft
#   sudo nano /etc/nginx/sites-available/gli-pft   # set YOUR_DOMAIN
#   sudo ln -sf /etc/nginx/sites-available/gli-pft /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Browser: https://YOUR_DOMAIN/gli/
# API:     https://YOUR_DOMAIN/gli/api/health
# =============================================================================

# HTTP → HTTPS (certbot may manage this block)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # /gli  →  /gli/
    location = /gli {
        return 301 /gli/;
    }

    # FastAPI behind /gli/api/…  (uvicorn still serves /api/… internally)
    location /gli/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React build (must be built with VITE_BASE_PATH=/gli/)
    location /gli/ {
        alias /opt/gli-pft/GLI-pulmonary-measurment/frontend/dist/;
        index index.html;
    }

    # Site root — replace with your portfolio/homepage later
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html><body><p><a href="/gli/">GLI PFT Calculator</a></p></body></html>';
    }
}
