# =============================================================================
# Nginx — HTTP only, access by EC2 public IP (no domain, no HTTPS)
# =============================================================================
# For quick testing before you have a domain + Let's Encrypt.
#
# Install:
#   sudo cp /opt/gli-pft/GLI-pulmonary-measurment/deploy/nginx-gli-pft-http-ip.conf \
#           /etc/nginx/sites-available/gli-pft
#   sudo ln -sf /etc/nginx/sites-available/gli-pft /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# AWS: Security group must allow inbound TCP port 80 from your IP or 0.0.0.0/0
#
# Browser: http://YOUR_EC2_PUBLIC_IP
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Accept any hostname (IP access, no domain)
    server_name _;

    # React build output
    root /opt/gli-pft/GLI-pulmonary-measurment/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # FastAPI (systemd gli-pft-api on localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
