# Install: sudo cp deploy/nginx-gli-pft.conf /etc/nginx/sites-available/gli-pft
#         sudo ln -sf /etc/nginx/sites-available/gli-pft /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN and SSL paths after certbot.

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # Let's Encrypt (certbot) — adjust paths
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # React production build
    root /opt/gli-pft/frontend/dist;
    index index.html;

    client_max_body_size 50M;   # large PFT Excel uploads

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
